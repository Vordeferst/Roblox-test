<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1">
<title>3D Платформа — Роблокс Нуб с мечом</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #87ceeb;
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }

  /* ========== HUD ========== */
  #hud {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    color: #fff; font-size: 12px; line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
    pointer-events: none; opacity: .8; z-index: 4;
    background: rgba(0,0,0,.25); padding: 5px 12px; border-radius: 8px;
    white-space: nowrap;
  }

  #fps {
    position: fixed; right: 12px; top: 12px; color: #fff; font-size: 14px;
    font-family: ui-monospace, monospace; font-weight: 700;
    background: rgba(0,0,0,.4); padding: 5px 11px; border-radius: 9px;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); z-index: 6; pointer-events: none;
    letter-spacing: .5px;
  }

  #swordStatus {
    position: fixed; right: 12px; top: 52px;
    color: #fff; font-size: 13px; font-weight: 700;
    background: rgba(0,0,0,.4); padding: 5px 12px; border-radius: 9px;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); z-index: 6; pointer-events: none;
    letter-spacing: .4px;
    transition: background .2s, color .2s;
  }
  #swordStatus.hasSword {
    background: linear-gradient(135deg, rgba(255,200,80,.85), rgba(255,140,40,.85));
    color: #2b1a00;
    text-shadow: none;
    box-shadow: 0 0 16px rgba(255,180,60,.7);
  }

  /* ========== SENSITIVITY ========== */
  #settings {
    position: fixed; left: 12px; top: 12px;
    background: rgba(0,0,0,.42); color: #fff;
    padding: 9px 13px 11px; border-radius: 11px;
    font-size: 12px; z-index: 6;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    min-width: 170px;
    border: 1px solid rgba(255,255,255,.1);
  }
  #settings .row {
    display: flex; justify-content: space-between;
    margin-bottom: 6px; opacity: .95; font-weight: 600;
  }
  #settings .row span:last-child { color: #7dd87d; font-family: ui-monospace, monospace; }
  #settings input[type=range] {
    width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,.25); border-radius: 2px; outline: none;
    cursor: pointer;
  }
  #settings input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  #settings input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; border: none;
    background: #fff; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }

  /* ========== JOYSTICK ========== */
  #joystick {
    position: fixed; bottom: 26px; left: 26px;
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at center,
      rgba(255,255,255,.16) 0%,
      rgba(255,255,255,.10) 60%,
      rgba(255,255,255,.06) 100%);
    border: 2px solid rgba(255,255,255,.4);
    box-shadow: inset 0 0 24px rgba(0,0,0,.15), 0 4px 14px rgba(0,0,0,.2);
    touch-action: none; z-index: 7;
  }
  #joystick::before {
    content: ''; position: absolute; inset: 22px; border-radius: 50%;
    border: 1px dashed rgba(255,255,255,.22); pointer-events: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 66px; height: 66px; margin: -33px 0 0 -33px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      rgba(255,255,255,.95),
      rgba(210,220,235,.85) 60%,
      rgba(160,180,200,.9) 100%);
    box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 -2px 6px rgba(0,0,0,.15);
    pointer-events: none;
  }

  /* ========== JUMP BUTTON ========== */
  #jumpBtn {
    position: fixed; bottom: 40px; right: 32px;
    width: 118px; height: 118px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      rgba(120,220,140,.75),
      rgba(60,160,90,.75) 70%,
      rgba(40,120,70,.85) 100%);
    border: 2px solid rgba(255,255,255,.7);
    color: #fff; font-size: 17px; font-weight: 800;
    letter-spacing: 1.2px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; z-index: 7;
    box-shadow: 0 6px 18px rgba(0,0,0,.3),
                inset 0 -4px 8px rgba(0,0,0,.15),
                inset 0 3px 6px rgba(255,255,255,.3);
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
    transition: transform .08s ease, filter .08s ease;
    cursor: pointer;
  }
  #jumpBtn.active {
    transform: scale(.93);
    filter: brightness(1.25);
  }

  /* ========== PICKUP TOAST ========== */
  #pickupToast {
    position: fixed; left: 50%; top: 25%;
    transform: translate(-50%, -50%) scale(.7);
    color: #fff; font-size: 22px; font-weight: 800;
    text-shadow: 0 2px 10px rgba(0,0,0,.8), 0 0 24px rgba(255,200,80,.9);
    background: rgba(0,0,0,.45);
    padding: 12px 28px; border-radius: 14px;
    border: 2px solid rgba(255,200,80,.7);
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .35s cubic-bezier(.2,1.5,.5,1);
    z-index: 8;
    white-space: nowrap;
  }
  #pickupToast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
</style>
</head>
<body>

<div id="fps">FPS: —</div>
<div id="swordStatus">🗡 Меч: нет</div>

<div id="settings">
  <div class="row"><span>Чувствительность</span><span id="sensVal">1.0×</span></div>
  <input type="range" id="sensSlider" min="0.3" max="3" step="0.1" value="1">
</div>

<div id="joystick"><div id="knob"></div></div>
<div id="jumpBtn">JUMP</div>

<div id="pickupToast">🗡 МЕЧ ПОЛУЧЕН!</div>

<div id="hud">WASD — ходьба · Shift — бег · Space — прыжок · ЛКМ / тап — атака · ПКМ / драг — камера</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   СЦЕНА / КАМЕРА / РЕНДЕРЕР
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 120);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   СВЕТ
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x556b2f, 1.15));

const sun = new THREE.DirectionalLight(0xfff3e0, 1.9);
sun.position.set(25, 45, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
const SH = 30;
sun.shadow.camera.left   = -SH;
sun.shadow.camera.right  =  SH;
sun.shadow.camera.top    =  SH;
sun.shadow.camera.bottom = -SH;
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

/* ============================================================
   ПЛАТФОРМА
   ============================================================ */
const PLATFORM_SIZE = 24;
const PLATFORM_THICKNESS = 1;
const HALF = PLATFORM_SIZE / 2;

function makeChecker() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  const cells = 8, s = 256 / cells;
  for (let y = 0; y < cells; y++) {
    for (let x = 0; x < cells; x++) {
      ctx.fillStyle = ((x + y) % 2 === 0) ? '#6fbf5a' : '#57a344';
      ctx.fillRect(x * s, y * s, s, s);
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(PLATFORM_SIZE / 3, PLATFORM_SIZE / 3);
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const platform = new THREE.Mesh(
  new THREE.BoxGeometry(PLATFORM_SIZE, PLATFORM_THICKNESS, PLATFORM_SIZE),
  new THREE.MeshStandardMaterial({ map: makeChecker(), roughness: 1 })
);
platform.position.y = -PLATFORM_THICKNESS / 2;
platform.receiveShadow = true;
scene.add(platform);

const rim = new THREE.Mesh(
  new THREE.BoxGeometry(PLATFORM_SIZE + 0.4, 0.6, PLATFORM_SIZE + 0.4),
  new THREE.MeshStandardMaterial({ color: 0x3d5c30, roughness: 1 })
);
rim.position.y = -PLATFORM_THICKNESS - 0.3;
rim.receiveShadow = true;
scene.add(rim);

const GROUND_Y = 0;

/* ============================================================
   МЕЧ
   ============================================================ */
function createSwordMesh(glow = false) {
  const g = new THREE.Group();

  const bladeMat = new THREE.MeshStandardMaterial({
    color: 0xe8edf2, metalness: 0.85, roughness: 0.18,
    emissive: glow ? 0x88bbff : 0x000000,
    emissiveIntensity: glow ? 0.45 : 0
  });
  const guardMat = new THREE.MeshStandardMaterial({
    color: 0x2a2a2a, metalness: 0.7, roughness: 0.35
  });
  const handleMat = new THREE.MeshStandardMaterial({
    color: 0x5a2f14, roughness: 0.9
  });

  // Рукоять
  const handle = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 0.06), handleMat);
  handle.position.y = 0.08;
  handle.castShadow = true;
  g.add(handle);

  // Навершие
  const pommel = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.06, 0.09), guardMat);
  pommel.position.y = 0.19;
  pommel.castShadow = true;
  g.add(pommel);

  // Гарда
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.045, 0.07), guardMat);
  guard.castShadow = true;
  g.add(guard);

  // Клинок
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.5, 0.028), bladeMat);
  blade.position.y = -0.27;
  blade.castShadow = true;
  g.add(blade);

  // Кончик (пирамидка)
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.1, 4), bladeMat);
  tip.position.y = -0.57;
  tip.rotation.x = Math.PI;
  tip.rotation.y = Math.PI / 4;
  tip.castShadow = true;
  g.add(tip);

  return g;
}

/* --- Меч на полу --- */
const SWORD_FLOOR_POS = new THREE.Vector3(4, 0.75, 4);
const floorSword = createSwordMesh(true);
floorSword.scale.setScalar(1.35);
floorSword.position.copy(SWORD_FLOOR_POS);
scene.add(floorSword);

/* --- Меч в руке --- */
const heldSword = createSwordMesh(false);
heldSword.scale.setScalar(1.0);
heldSword.visible = false;

/* ============================================================
   ПЕРСОНАЖ — РОБЛОКС НУБ (похудевший)
   ============================================================ */
function makeLimb(w, h, d, mat, px, py) {
  const pivot = new THREE.Group();
  pivot.position.set(px, py, 0);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.y = -h / 2;
  mesh.castShadow = true;
  pivot.add(mesh);
  return pivot;
}

const ARM_H = 0.72; // высота руки — используется для крепления меча

function createNoob() {
  const g = new THREE.Group();

  const yellow = new THREE.MeshStandardMaterial({ color: 0xf5cd30, roughness: 0.75 });
  const blue   = new THREE.MeshStandardMaterial({ color: 0x4b9fe1, roughness: 0.75 });
  const green  = new THREE.MeshStandardMaterial({ color: 0x75b84b, roughness: 0.75 });
  const black  = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.55 });

  const legH = 0.70, legW = 0.30, legD = 0.24;
  const torsoH = 0.72, torsoW = 0.72, torsoD = 0.26;
  const armW = 0.24, armD = 0.20;
  const headSize = 0.54;

  const legL = makeLimb(legW, legH, legD, green, -0.18, legH);
  const legR = makeLimb(legW, legH, legD, green,  0.18, legH);
  g.add(legL, legR);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(torsoW, torsoH, torsoD), blue);
  torso.position.y = legH + torsoH / 2;
  torso.castShadow = true;
  g.add(torso);

  const armPivotY = legH + torsoH - 0.03;
  const armL = makeLimb(armW, ARM_H, armD, yellow, -0.47, armPivotY);
  const armR = makeLimb(armW, ARM_H, armD, yellow,  0.47, armPivotY);
  g.add(armL, armR);

  const headY = legH + torsoH + headSize / 2;
  const head = new THREE.Mesh(new THREE.BoxGeometry(headSize, headSize, headSize), yellow);
  head.position.y = headY;
  head.castShadow = true;
  g.add(head);

  const faceZ = headSize / 2 + 0.002;
  const eyeGeo = new THREE.BoxGeometry(0.09, 0.11, 0.02);
  const eL = new THREE.Mesh(eyeGeo, black);
  eL.position.set(-0.11, headY + 0.06, faceZ); g.add(eL);
  const eR = new THREE.Mesh(eyeGeo, black);
  eR.position.set(0.11, headY + 0.06, faceZ); g.add(eR);

  const mouthY = headY - 0.10;
  const mSide = new THREE.BoxGeometry(0.06, 0.035, 0.02);
  const mMid  = new THREE.BoxGeometry(0.14, 0.035, 0.02);
  const m1 = new THREE.Mesh(mSide, black); m1.position.set(-0.085, mouthY + 0.03, faceZ); g.add(m1);
  const m2 = new THREE.Mesh(mMid,  black); m2.position.set(0, mouthY, faceZ);            g.add(m2);
  const m3 = new THREE.Mesh(mSide, black); m3.position.set(0.085, mouthY + 0.03, faceZ); g.add(m3);

  return { group: g, legL, legR, armL, armR };
}

const noob = createNoob();
scene.add(noob.group);

// Прикрепляем меч к правой руке — в "ладонь"
heldSword.position.set(0.0, -ARM_H + 0.04, 0.06);
noob.armR.add(heldSword);

/* ============================================================
   ИГРОК
   ============================================================ */
const player = {
  pos: new THREE.Vector3(0, 0, 0),
  vel: new THREE.Vector3(),
  onGround: true,
  facing: 0,
};

const prevPos = new THREE.Vector3().copy(player.pos);
let prevFacing = 0;

const GRAVITY    = 24;
const JUMP_SPEED = 9;
const WALK_SPEED = 5.5;
const RUN_SPEED  = 9;
const RESPAWN_Y  = -15;

let walkPhase = 0;
let airPose = 0;

/* ============================================================
   СОСТОЯНИЕ МЕЧА
   ============================================================ */
let hasSword = false;
let attackTimer = 0;
const ATTACK_DURATION = 0.5;
const PICKUP_RADIUS = 1.5;

const swordStatusEl = document.getElementById('swordStatus');
const pickupToastEl = document.getElementById('pickupToast');

function triggerAttack() {
  if (!hasSword) return;
  if (attackTimer > 0) return; // уже в процессе
  attackTimer = ATTACK_DURATION;
}

function pickUpSword() {
  if (hasSword) return;
  hasSword = true;
  floorSword.visible = false;
  heldSword.visible = true;

  swordStatusEl.textContent = '🗡 Меч: есть';
  swordStatusEl.classList.add('hasSword');

  pickupToastEl.classList.add('show');
  setTimeout(() => pickupToastEl.classList.remove('show'), 1400);
}

/* ============================================================
   КЛАВИАТУРА
   ============================================================ */
const keys = Object.create(null);
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ============================================================
   КАМЕРА + ЧУВСТВИТЕЛЬНОСТЬ
   ============================================================ */
let camYaw   = 0;
let camPitch = 0.85;
let camDist  = 8;

const PITCH_MIN = -0.10;
const PITCH_MAX =  1.40;
const DIST_MIN  = 4;
const DIST_MAX  = 15;

let cameraSensitivity = 1.0;

const sensSlider = document.getElementById('sensSlider');
const sensVal    = document.getElementById('sensVal');

sensSlider.addEventListener('input', () => {
  cameraSensitivity = parseFloat(sensSlider.value);
  sensVal.textContent = cameraSensitivity.toFixed(1) + '×';
});

const clampPitch = (v) => Math.max(PITCH_MIN, Math.min(PITCH_MAX, v));

/* --- вращение камеры (ПКМ на ПК, любой тач-драг на мобилке) --- */
let camPointerId = null;
let camLastX = 0, camLastY = 0;

function startCamDrag(e) {
  if (e.pointerType === 'mouse' && e.button !== 2) return;
  if (camPointerId !== null) return;
  camPointerId = e.pointerId;
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
  camLastX = e.clientX;
  camLastY = e.clientY;
  e.preventDefault();
}

function moveCamDrag(e) {
  if (e.pointerId !== camPointerId) return;
  const dx = e.clientX - camLastX;
  const dy = e.clientY - camLastY;
  camLastX = e.clientX;
  camLastY = e.clientY;

  const s = cameraSensitivity;
  camYaw   -= dx * 0.0032 * s;
  camPitch += dy * 0.0032 * s;
  camPitch = clampPitch(camPitch);
  e.preventDefault();
}

function endCamDrag(e) {
  if (e.pointerId !== camPointerId) return;
  camPointerId = null;
}

renderer.domElement.addEventListener('pointerdown', startCamDrag);
renderer.domElement.addEventListener('pointermove', moveCamDrag);
renderer.domElement.addEventListener('pointerup', endCamDrag);
renderer.domElement.addEventListener('pointercancel', endCamDrag);

addEventListener('contextmenu', (e) => e.preventDefault());

/* --- ЗУМ --- */
addEventListener('wheel', (e) => {
  camDist += e.deltaY * 0.008;
  camDist = Math.max(DIST_MIN, Math.min(DIST_MAX, camDist));
}, { passive: true });

/* ============================================================
   АТАКА: ЛКМ / ТАП
   ============================================================ */
const TAP_MAX_DIST = 14;   // px — больше = драг
const TAP_MAX_TIME = 320;  // ms

let tapPointerId = null;
let tapStartX = 0, tapStartY = 0, tapStartTime = 0, tapMoved = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  // ПК: левая кнопка = атака
  if (e.pointerType === 'mouse' && e.button === 0) {
    triggerAttack();
    return;
  }
  // Тач/перо: начинаем отслеживать потенциальный тап
  if (e.pointerType !== 'mouse') {
    tapPointerId = e.pointerId;
    tapStartX = e.clientX;
    tapStartY = e.clientY;
    tapStartTime = performance.now();
    tapMoved = false;
  }
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerId !== tapPointerId) return;
  const dx = e.clientX - tapStartX;
  const dy = e.clientY - tapStartY;
  if (Math.hypot(dx, dy) > TAP_MAX_DIST) tapMoved = true;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (e.pointerId !== tapPointerId) return;
  const dt = performance.now() - tapStartTime;
  if (!tapMoved && dt < TAP_MAX_TIME) {
    triggerAttack();
  }
  tapPointerId = null;
});

/* ============================================================
   ДЖОЙСТИК
   ============================================================ */
const joyEl  = document.getElementById('joystick');
const knobEl = document.getElementById('knob');

const joyValue = { x: 0, y: 0 };
let joyPointerId = null;
let joyCenterX = 0, joyCenterY = 0;
const JOY_RADIUS = 62;

function updateJoy(cx, cy) {
  let dx = cx - joyCenterX;
  let dy = cy - joyCenterY;
  const d = Math.hypot(dx, dy);
  if (d > JOY_RADIUS) {
    dx = dx / d * JOY_RADIUS;
    dy = dy / d * JOY_RADIUS;
  }
  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  joyValue.x = dx / JOY_RADIUS;
  joyValue.y = dy / JOY_RADIUS;
}

joyEl.addEventListener('pointerdown', (e) => {
  if (joyPointerId !== null) return;
  joyPointerId = e.pointerId;
  try { joyEl.setPointerCapture(e.pointerId); } catch (_) {}
  const r = joyEl.getBoundingClientRect();
  joyCenterX = r.left + r.width / 2;
  joyCenterY = r.top + r.height / 2;
  updateJoy(e.clientX, e.clientY);
  e.preventDefault();
  e.stopPropagation();
});

joyEl.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyPointerId) return;
  updateJoy(e.clientX, e.clientY);
  e.preventDefault();
  e.stopPropagation();
});

function joyRelease(e) {
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  joyValue.x = 0;
  joyValue.y = 0;
  knobEl.style.transform = 'translate(0,0)';
  e.preventDefault();
  e.stopPropagation();
}
joyEl.addEventListener('pointerup', joyRelease);
joyEl.addEventListener('pointercancel', joyRelease);

/* ============================================================
   КНОПКА ПРЫЖКА
   ============================================================ */
const jumpEl = document.getElementById('jumpBtn');
let jumpPointerId = null;

jumpEl.addEventListener('pointerdown', (e) => {
  if (jumpPointerId !== null) return;
  jumpPointerId = e.pointerId;
  try { jumpEl.setPointerCapture(e.pointerId); } catch (_) {}
  keys['Space'] = true;
  jumpEl.classList.add('active');
  e.preventDefault();
  e.stopPropagation();
});

function jumpRelease(e) {
  if (e.pointerId !== jumpPointerId) return;
  jumpPointerId = null;
  keys['Space'] = false;
  jumpEl.classList.remove('active');
  e.preventDefault();
  e.stopPropagation();
}
jumpEl.addEventListener('pointerup', jumpRelease);
jumpEl.addEventListener('pointercancel', jumpRelease);

/* ============================================================
   ФИЗИКА
   ============================================================ */
function updatePlayer(dt) {
  /* --- ввод --- */
  let ix = 0, iz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    iz -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  iz += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;

  ix += joyValue.x;
  iz += joyValue.y;

  /* --- направление относительно камеры --- */
  const fx = -Math.sin(camYaw);
  const fz = -Math.cos(camYaw);
  const rx = -fz;
  const rz =  fx;

  const inMag = Math.hypot(ix, iz);
  let dx = 0, dz = 0;
  if (inMag > 1e-4) {
    const nx = ix / inMag;
    const nz = iz / inMag;
    const scale = Math.min(1, inMag);
    dx = (fx * (-nz) + rx * nx) * scale;
    dz = (fz * (-nz) + rz * nx) * scale;
  }

  /* --- скорость --- */
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
  const targetSpeed = sprint ? RUN_SPEED : WALK_SPEED;
  const accel = player.onGround ? 28 : 7;
  const k = 1 - Math.exp(-accel * dt);

  player.vel.x += (dx * targetSpeed - player.vel.x) * k;
  player.vel.z += (dz * targetSpeed - player.vel.z) * k;

  /* --- прыжок --- */
  if (keys['Space'] && player.onGround) {
    player.vel.y = JUMP_SPEED;
    player.onGround = false;
  }

  /* --- гравитация --- */
  player.vel.y -= GRAVITY * dt;
  if (player.vel.y < -55) player.vel.y = -55;

  /* --- интегрирование --- */
  player.pos.x += player.vel.x * dt;
  player.pos.y += player.vel.y * dt;
  player.pos.z += player.vel.z * dt;

  /* --- столкновение с платформой --- */
  const insideXZ = Math.abs(player.pos.x) <= HALF && Math.abs(player.pos.z) <= HALF;
  if (player.pos.y <= GROUND_Y && insideXZ && player.vel.y <= 0) {
    player.pos.y = GROUND_Y;
    player.vel.y = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  /* --- респавн --- */
  if (player.pos.y < RESPAWN_Y) {
    player.pos.set(0, 3, 0);
    player.vel.set(0, 0, 0);
  }

  /* --- поворот в сторону движения --- */
  if (inMag > 0.05) {
    const targetFacing = Math.atan2(dx, dz);
    let diff = targetFacing - player.facing;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.facing += diff * Math.min(1, 14 * dt);
  }

  /* --- фаза анимации ходьбы --- */
  const hSpeed = Math.hypot(player.vel.x, player.vel.z);
  const moving = player.onGround && hSpeed > 0.4;
  if (moving) {
    walkPhase += hSpeed * dt * 3.2;
  } else if (player.onGround) {
    const target = Math.round(walkPhase / Math.PI) * Math.PI;
    walkPhase += (target - walkPhase) * Math.min(1, 10 * dt);
  }

  /* --- воздушная поза --- */
  const targetAir = player.onGround ? 0 : 1;
  airPose += (targetAir - airPose) * Math.min(1, 12 * dt);

  /* --- таймер атаки --- */
  if (attackTimer > 0) {
    attackTimer = Math.max(0, attackTimer - dt);
  }

  /* --- подбор меча --- */
  if (!hasSword) {
    const ddx = player.pos.x - SWORD_FLOOR_POS.x;
    const ddz = player.pos.z - SWORD_FLOOR_POS.z;
    if (ddx * ddx + ddz * ddz < PICKUP_RADIUS * PICKUP_RADIUS) {
      pickUpSword();
    }
  }
}

/* ============================================================
   АНИМАЦИЯ МОДЕЛИ
   ============================================================ */
function computeAttackAngle() {
  const t = 1 - attackTimer / ATTACK_DURATION; // 0 → 1
  if (t < 0.35) {
    // Замах назад-вверх
    const p = t / 0.35;
    return THREE.MathUtils.lerp(0, 2.2, p);
  } else if (t < 0.6) {
    // Резкий удар вперёд
    const p = (t - 0.35) / 0.25;
    return THREE.MathUtils.lerp(2.2, -1.5, p);
  } else {
    // Возврат
    const p = (t - 0.6) / 0.4;
    return THREE.MathUtils.lerp(-1.5, 0, p);
  }
}

function animateModel(hSpeed) {
  const amp = Math.min(0.85, hSpeed * 0.09) * (1 - airPose);
  const s = Math.sin(walkPhase);
  const w = airPose;

  /* --- Ноги --- */
  const gLegL =  s * amp;
  const gLegR = -s * amp;
  const aLegL = -0.45, aLegR = 0.28;
  noob.legL.rotation.x = gLegL * (1 - w) + aLegL * w;
  noob.legR.rotation.x = gLegR * (1 - w) + aLegR * w;

  /* --- Левая рука (обычная) --- */
  const gArmL = -s * amp * 0.9;
  const aArmL = -0.95;
  noob.armL.rotation.x = gArmL * (1 - w) + aArmL * w;

  /* --- Правая рука --- */
  let armRrot;
  if (attackTimer > 0) {
    // Атака перекрывает всё
    armRrot = computeAttackAngle();
  } else if (hasSword) {
    // Держим меч — рука чуть вперёд, меньший размах при ходьбе
    const idleHold = -0.5;
    const swing = s * amp * 0.3;
    armRrot = idleHold + swing;
    // В воздухе — поднимаем меч
    armRrot = armRrot * (1 - w) + (-1.2) * w;
  } else {
    // Обычная анимация
    const gArmR = s * amp * 0.9;
    const aArmR = -0.95;
    armRrot = gArmR * (1 - w) + aArmR * w;
  }
  noob.armR.rotation.x = armRrot;

  /* --- Лёгкое покачивание корпуса --- */
  noob.group.rotation.z = Math.sin(walkPhase) * 0.03 * amp;
}

/* ============================================================
   КАМЕРА
   ============================================================ */
const camLook = new THREE.Vector3();

function updateCamera(renderPos) {
  const cosP = Math.cos(camPitch);
  const sinP = Math.sin(camPitch);

  const camX = renderPos.x + Math.sin(camYaw) * cosP * camDist;
  const camZ = renderPos.z + Math.cos(camYaw) * cosP * camDist;
  const camY = renderPos.y + sinP * camDist + 0.6;

  camera.position.set(camX, camY, camZ);
  camLook.set(renderPos.x, renderPos.y + 1.1, renderPos.z);
  camera.lookAt(camLook);
}

/* ============================================================
   FPS
   ============================================================ */
const fpsEl = document.getElementById('fps');
let fpsFrames = 0;
let fpsAccum = 0;

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
const FIXED_DT = 1 / 120;
let accumulator = 0;
let lastTime = performance.now();

const renderPos = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let frameTime = (now - lastTime) / 1000;
  lastTime = now;
  if (frameTime > 0.1) frameTime = 0.1;

  /* --- FPS --- */
  fpsFrames++;
  fpsAccum += frameTime;
  if (fpsAccum >= 0.4) {
    fpsEl.textContent = 'FPS: ' + Math.round(fpsFrames / fpsAccum);
    fpsFrames = 0;
    fpsAccum = 0;
  }

  /* --- анимация меча на полу --- */
  if (!hasSword) {
    const t = now / 1000;
    floorSword.rotation.y = t * 1.3;
    floorSword.position.y = SWORD_FLOOR_POS.y + Math.sin(t * 2.4) * 0.14;
    // лёгкое покачивание клинка
    floorSword.rotation.z = Math.sin(t * 1.7) * 0.08;
  }

  /* --- физика фиксированным шагом --- */
  accumulator += frameTime;
  if (accumulator > 0.2) accumulator = 0.2;

  while (accumulator >= FIXED_DT) {
    prevPos.copy(player.pos);
    prevFacing = player.facing;
    updatePlayer(FIXED_DT);
    accumulator -= FIXED_DT;
  }

  /* --- интерполяция --- */
  const alpha = accumulator / FIXED_DT;
  renderPos.lerpVectors(prevPos, player.pos, alpha);
  const facing = prevFacing + (player.facing - prevFacing) * alpha;

  const hSpeed = Math.hypot(player.vel.x, player.vel.z);
  animateModel(hSpeed);

  noob.group.position.copy(renderPos);
  noob.group.rotation.y = facing;

  updateCamera(renderPos);

  sun.position.set(renderPos.x + 25, 45, renderPos.z + 18);
  sun.target.position.set(renderPos.x, 0, renderPos.z);
  sun.target.updateMatrixWorld();

  renderer.render(scene, camera);
}

animate();
</script>
